<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE FOOTBALL - Live Score Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span {
            color: #22c55e;
        }
        nav a {
            color: #9ca3af;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
        }
        nav a.active {
            color: #22c55e;
            border-bottom: 2px solid #22c55e;
            padding-bottom: 5px;
        }
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .widget-box {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h3 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚽ <span>LIVE</span> FOOTBALL</div>
        <nav>
            <a href="#" class="active">Live</a>
            <a href="#">Fixtures</a>
            <a href="#">Results</a>
        </nav>
    </header>

    <div class="container">
        <h3>🔴 REAL-TIME LIVE SCORES</h3>
        
        <div class="widget-box">
            <script type="text/javascript" src="https://www.sofascore.com/bundles/sofascorejs/js/embed-live.min.js"></script>
            <div id="sofascore-live-embed" data-widget-id="football-live"></div>
        </div>
    </div>

</body>
</html>
